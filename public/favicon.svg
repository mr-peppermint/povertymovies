<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <rect width="48" height="48" rx="8" fill="#0a0a0a"/>
  <rect x="1" y="1" width="46" height="46" rx="7" stroke="#e50914" stroke-opacity="0.5" stroke-width="1.5"/>
  
  <!-- Clapper top bar -->
  <rect x="7" y="8" width="34" height="8" rx="2" fill="#1c1c1c" stroke="#333" stroke-width="1"/>
  <line x1="14" y1="8" x2="18" y2="16" stroke="#e50914" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="23" y1="8" x2="27" y2="16" stroke="#e50914" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="8" x2="36" y2="16" stroke="#e50914" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Film / Screen body -->
  <rect x="7" y="18" width="34" height="22" rx="3" fill="#141414" stroke="#2c2c2c" stroke-width="1"/>

  <!-- Film perforations on side -->
  <rect x="9" y="21" width="3" height="4" rx="0.8" fill="#2a2a2a"/>
  <rect x="9" y="27" width="3" height="4" rx="0.8" fill="#2a2a2a"/>
  <rect x="9" y="33" width="3" height="4" rx="0.8" fill="#2a2a2a"/>

  <rect x="36" y="21" width="3" height="4" rx="0.8" fill="#2a2a2a"/>
  <rect x="36" y="27" width="3" height="4" rx="0.8" fill="#2a2a2a"/>
  <rect x="36" y="33" width="3" height="4" rx="0.8" fill="#2a2a2a"/>

  <!-- Centered Play Icon with Gradient / Vibrant Red -->
  <polygon points="20,23 31,29 20,35" fill="#e50914"/>
  <polygon points="20,23 26,26.3 20,29.5" fill="#ff3843"/>
</svg>
